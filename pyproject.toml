[project]
name = "allegro-sonata"
requires-python = ">=3.13"
version = "0.1.0"
description = "An algorithmic music composition toolbox written in Python and Rust."
readme = "README.md"
authors = [{ name = "Alex Bielen", email = "alexhendriebielen@gmail.com" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "matplotlib>=3.10.8",
    "rich>=14.3.3",
    "seaborn>=0.13.2",
    "typer>=0.24.1",
]

[project.optional-dependencies]
tests = ["pytest"]
plot = ["seaborn", "matplotlib"]

[project.scripts]
build-and-test = "allegro._build_scripts:build_and_test"
benchmarks = "allegro._build_scripts:run_benchmarks"

[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
# auto-initialize caches the Python interpreter so each pyfunction call doesn't pay
# ~hundreds of µs of init overhead (see pyo3.rs "Features for embedding" / auto-initialize).
features = ["pyo3/extension-module"]

[tool.bandit]
exclude_dirs = ["python/tests", "python/allegro/_build_scripts.py"]

[dependency-groups]
dev = [
    "hypothesis>=6.151.5",
    "maturin>=1.8,<2.0",
    "pytest>=9.0.2",
    "pytest-benchmark>=5.0.0",
    "ruff>=0.8.0",
]
