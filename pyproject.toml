[project]
name = "allegro"
requires-python = ">=3.13"
version = "0.1.0"
description = "An algorithmic music composition toolbox written in Python and Rust."
readme = "README.md"
authors = [{ name = "Alex Bielen", email = "alexhendriebielen@gmail.com" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.optional-dependencies]
tests = ["pytest"]

[project.scripts]
dev-build = "allegro._dev:main"

[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = ["maturin>=1.8,<2.0", "pytest>=9.0.2"]
