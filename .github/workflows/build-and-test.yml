name: Build and Test

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Check Python stubs are up to date
        run: |
          set -e
          cargo run --bin stub_gen
          git diff --exit-code -- python/allegro
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist -i python3.13
          sccache: true
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist
      - name: pytest
        shell: bash
        run: |
          set -e
          unset RUSTC_WRAPPER
          uv sync --locked --all-extras --dev
          uv pip install allegro-sonata --find-links dist --force-reinstall
          uv run pytest
      - name: Rust coverage (pytest against instrumented extension)
        shell: bash
        run: |
          set -e
          unset RUSTC_WRAPPER
          rustup component add llvm-tools-preview
          ./scripts/rust_coverage.sh
      # Optional: add CODECOV_TOKEN in repo secrets for private repos or if tokenless upload fails.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/rust-coverage/lcov.info
          disable_search: true
          flags: rust
          fail_ci_if_error: true
      - name: Upload Rust coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-html
          path: target/rust-coverage/html
