[package]
name = "allegro"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "allegro"
crate-type = ["cdylib", "rlib"]

[dependencies]
fraction = "0.15.3"
glam = "0.29"
pyo3 = "0.26.0"
pyo3-stub-gen = "0.22.3"
pyo3-stub-gen-derive = "0.22.3"
rand = "0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "stub_gen"
path = "src/stub_gen.rs"
